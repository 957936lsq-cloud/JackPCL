name: PCL Jack Release

on:
  push:
    branches:
      - jack-release
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pcl-jack-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Release PCL Jack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Read version and verify patches
        shell: pwsh
        run: |
          $baseFile = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
          $secretFile = "Plain Craft Launcher 2\Modules\ModSecret.vb"
          $versionLine = Select-String -Path $baseFile -Pattern 'VersionBaseName As String = "([^"]+)"'
          if (-not $versionLine) { throw "Unable to determine PCL version." }
          $version = $versionLine.Matches[0].Groups[1].Value
          "PCL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Select-String -Path $secretFile -Pattern 'Public Const RestrictMcDownload As Boolean = False')) {
            throw "Minecraft download patch is missing."
          }

      - name: Update built-in help
        shell: pwsh
        run: |
          $helpDir = Join-Path $env:RUNNER_TEMP "PCL2Help"
          $helpZip = Join-Path $env:RUNNER_TEMP "Help.zip"
          if (Test-Path $helpDir) { Remove-Item $helpDir -Recurse -Force }
          if (Test-Path $helpZip) { Remove-Item $helpZip -Force }
          git clone https://github.com/LTCatt/PCL2Help.git $helpDir -b master --single-branch --depth 1
          Remove-Item (Join-Path $helpDir ".git") -Recurse -Force
          Compress-Archive -Path (Join-Path $helpDir "*") -DestinationPath $helpZip -CompressionLevel Optimal
          Copy-Item $helpZip "Plain Craft Launcher 2\Resources\Help.zip" -Force

      - name: Inject optional API credentials
        shell: pwsh
        env:
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          $secretPath = "Plain Craft Launcher 2\Modules\ModSecret.vb"
          $basePath = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
          $secretText = Get-Content $secretPath -Raw

          if (-not [string]::IsNullOrWhiteSpace($env:PCL_MS_CLIENT_ID)) {
            $secretText = $secretText.Replace(
              'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")',
              ('Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "' + $env:PCL_MS_CLIENT_ID + '")')
            )
          }

          if (-not [string]::IsNullOrWhiteSpace($env:PCL_CURSEFORGE_API_KEY)) {
            $secretText = $secretText.Replace(
              'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")',
              ('Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "' + $env:PCL_CURSEFORGE_API_KEY + '")')
            )
          }

          Set-Content -Path $secretPath -Value $secretText -Encoding utf8

          $baseText = Get-Content $basePath -Raw
          $baseText = $baseText.Replace(
            'Public Const CommitHash As String = ""',
            'Public Const CommitHash As String = "${{ github.sha }}"'
          )
          Set-Content -Path $basePath -Value $baseText -Encoding utf8

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore "PCLCS\PCLCS.csproj"

      - name: Build Release
        shell: pwsh
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release -m

      - name: Package
        shell: pwsh
        run: |
          $candidates = @(
            "Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe",
            "Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe",
            "Plain Craft Launcher 2\bin\Release\Plain Craft Launcher 2.exe"
          )
          $sourceExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sourceExe) { throw "Build succeeded but launcher exe was not found." }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $sourceExe "dist\PCL-Jack.exe" -Force
          Copy-Item "LICENCE" "dist\LICENCE" -Force

          @"
          Plain Craft Launcher (PCL) Jack 修改版

          第三方基于 Plain Craft Launcher (PCL) 独立进行二次创作，非 PCL 官方版本。
          原项目：Meloong-Git/PCL
          原作者：龙腾猫跃（LTCat）
          修改版源码：https://github.com/${{ github.repository }}/tree/jack-release

          主要改动：
          - 恢复 Minecraft 下载功能
          - 禁用启动器自动更新与更新检查
          - 默认关闭启动器公告
          - 精简非必要启动、购买和赞助提示
          - 保留功能性错误提示与许可证要求的最低限度提示

          Base version: $env:PCL_VERSION
          Commit: ${{ github.sha }}
          "@ | Set-Content "dist\NOTICE.txt" -Encoding utf8

          Compress-Archive -Path "dist\PCL-Jack.exe", "dist\NOTICE.txt", "dist\LICENCE" -DestinationPath "dist\PCL-Jack.zip" -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL-Jack-${{ env.PCL_VERSION }}-${{ github.run_number }}
          path: |
            dist/PCL-Jack.exe
            dist/PCL-Jack.zip
            dist/NOTICE.txt
            dist/LICENCE
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pcl-jack-$env:PCL_VERSION-build-${{ github.run_number }}"
          $title = "Plain Craft Launcher (PCL) Jack 修改版 $env:PCL_VERSION · Build ${{ github.run_number }}"
          $notes = "第三方 PCL 修改版，非官方版本。基于 PCL $env:PCL_VERSION；恢复 Minecraft 下载；禁用启动器更新检查；默认关闭启动器公告；精简非必要提示。源码分支：jack-release。"
          gh release create $tag "dist\PCL-Jack.exe" "dist\PCL-Jack.zip" "dist\NOTICE.txt" "dist\LICENCE" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title $title --notes $notes --latest
